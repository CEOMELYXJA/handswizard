name: Python mouse safety tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  mouse-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests without requiring camera or display
        run: python -m unittest discover -s tests -v
